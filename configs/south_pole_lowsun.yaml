# Representative south-polar scenario (SPEC 4.1): sun a few degrees above the horizon,
# long shadows. Two-layer terrain: 2 km x 2 km at 1 m + 100 m near patch at 5 cm.
# Roughness / crater / rock values: see docs/references.md (several are sample values).
# Sensors: monocular navcam + two headlights, LiDAR (SPAD flash + 32-line spinning).
name: south_pole_lowsun
seed: 2026
site:
  latitude_deg: -89.5
  longitude_deg: 0.0
sun:
  mode: astronomical
  utc: "2026-12-20T00:00:00Z"   # elevation ≈ 1.6°, azimuth ≈ 49° (analytic ≈ SPICE within 0.07°)
terrain:
  size_x_m: 2000.0
  size_y_m: 2000.0
  resolution_m: 1.0
  fractal:
    hurst: 0.85
    rms_slope_deg: 6.0
    baseline_m: 1.0
    rolloff_wavelength_m: 400.0
  tilt:
    slope_deg: 3.0
    downhill_azimuth_deg: 50.0
  craters:
    enabled: true
    sfd: {mode: equilibrium, equilibrium_fraction: 0.02, d_min_m: 0.3, d_max_m: 300.0}
  rocks:
    enabled: true
    k: 0.05
    d_min_m: 0.15
    d_max_m: 4.0
    ejecta: {enabled: true, k: 0.15, min_crater_diameter_m: 20.0}
  near:
    enabled: true
    size_m: 100.0
    resolution_m: 0.05
# Monocular navcam (~0.3 s per image with lights). The stereo pair lives in
# south_pole_lowsun_stereo.yaml.
cameras:
  - name: navcam             # generic sample geometry
    intrinsics: {width: 640, height: 480, hfov_deg: 70.0}
    sensor: {auto_exposure: true, ae_percentile: 99.5, ae_target_fraction: 0.8, bits: 12}
    mount: {x_m: 0.5, y_m: 0.0, z_m: 1.0, pitch_deg: 12.0}
lights:                      # two headlights (sample values, see SpotlightConfig)
  - name: headlight_left
    mount: {x_m: 0.6, y_m: 0.3, z_m: 0.4, pitch_deg: 15.0}
    flux_lm: 3000.0
  - name: headlight_right
    mount: {x_m: 0.6, y_m: -0.3, z_m: 0.4, pitch_deg: 15.0}
    flux_lm: 3000.0
rover:
  kinematics: skid_steer
  wheels: 4
  wheelbase_m: 1.0
  track_m: 0.8
  origin_height_m: 0.5
  cg_height_m: 0.45
  max_speed_m_s: 0.2
lidars:
  # SPAD flash LiDAR (primary). Generic sample parameters, see LidarSpadConfig.
  - name: spad_flash
    pattern: {kind: flash, flash_width: 160, flash_height: 120, flash_hfov_deg: 60.0, flash_vfov_deg: 45.0,
              flash_projection: azel}   # rows = arcs around the sensor (see LidarPatternConfig)
    # mast: 3.7 m above flat ground (body origin = origin_height_m 0.5 m), 22 deg down (pitch > 0)
    mount: {x_m: 0.55, z_m: 3.2, pitch_deg: 22.0}
    noise:
      model: spad
      range_max_m: 100.0
      spad: {pulse_energy_j: 1.0e-6, filter_bandwidth_nm: 1.0, pulses_per_frame: 1000}
  # Rotating 32-beam LiDAR with the simple Gaussian model (for comparison).
  - name: spin32
    pattern: {kind: spinning, channels: 32, vertical_min_deg: -25.0, vertical_max_deg: 15.0, horizontal_resolution_deg: 0.2}
    noise: {model: gaussian, range_max_m: 100.0}
