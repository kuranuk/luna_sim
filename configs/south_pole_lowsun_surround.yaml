# Representative south-polar scenario (SPEC 4.1): sun a few degrees above the horizon,
# long shadows. Two-layer terrain: 2 km x 2 km at 1 m + 100 m near patch at 5 cm.
# Roughness / crater / rock values: see docs/references.md (several are sample values).
# Sensors: front navcam + left / right side cameras + rear camera, two headlights, LiDAR.
# Same as south_pole_lowsun.yaml plus the side and rear cameras of the browser simulator
# (generic sample geometry; rendering cost grows with the number of cameras).
name: south_pole_lowsun_surround
seed: 2026
site:
  # Site01 "Connecting ridge", centre of ROI 4 of Barker et al. (2021); same as the browser preset
  latitude_deg: -89.453
  longitude_deg: 222.88
sun:
  mode: astronomical
  utc: "2026-12-01T12:00:00Z"   # elevation ≈ 1.8°, azimuth ≈ 51° (analytic model)
terrain:
  size_x_m: 2000.0
  size_y_m: 2000.0
  resolution_m: 1.0
  fractal:
    hurst: 0.85
    rms_slope_deg: 6.0
    baseline_m: 1.0
    rolloff_wavelength_m: 400.0
  # Base shape = real data: LOLA 5 m/pix DEM of Site01 (Barker et al. 2021, Planet. Space Sci. 203,
  # 105119; NASA GSFC PGDA https://pgda.gsfc.nasa.gov/products/78), cropped to +-1.6 km around the
  # site by scripts/fetch_lola_dem.py --npy. No synthetic regional tilt. Fractal relief and craters
  # are added below 40 m only (sample value: ~90 % of the 5 m pixels are interpolated).
  dem:
    enabled: true
    path: dem/lola_site01_5mpp.npy
    projection: polar_stereographic
    pixel_size: 5.0
    origin_x: -12887.5
    origin_y: -10552.5
    detail_below_m: 40.0
  craters:
    enabled: true
    sfd: {mode: equilibrium, equilibrium_fraction: 0.02, d_min_m: 0.3, d_max_m: 300.0}
  rocks:
    enabled: true
    k: 0.05
    d_min_m: 0.15
    d_max_m: 4.0
    ejecta: {enabled: true, k: 0.15, min_crater_diameter_m: 20.0}
  near:
    enabled: true
    size_m: 100.0
    resolution_m: 0.05
# Monocular navcam (~0.3 s per image with lights). The stereo pair lives in
# south_pole_lowsun_stereo.yaml.
cameras:
  - name: navcam             # generic sample geometry
    intrinsics: {width: 640, height: 480, hfov_deg: 70.0}
    sensor: {auto_exposure: true, ae_percentile: 99.5, ae_target_fraction: 0.8, bits: 12}
    mount: {x_m: 0.5, y_m: 0.0, z_m: 1.0, pitch_deg: 12.0}
  - name: side_left          # mount yaw: +90 deg = left, 180 deg = backward
    intrinsics: {width: 640, height: 480, hfov_deg: 90.0}
    sensor: {auto_exposure: true, ae_percentile: 99.5, ae_target_fraction: 0.8, bits: 12}
    mount: {x_m: 0.0, y_m: 0.45, z_m: 1.0, pitch_deg: 20.0, yaw_deg: 90.0}
  - name: side_right
    intrinsics: {width: 640, height: 480, hfov_deg: 90.0}
    sensor: {auto_exposure: true, ae_percentile: 99.5, ae_target_fraction: 0.8, bits: 12}
    mount: {x_m: 0.0, y_m: -0.45, z_m: 1.0, pitch_deg: 20.0, yaw_deg: -90.0}
  - name: rear
    intrinsics: {width: 640, height: 480, hfov_deg: 90.0}
    sensor: {auto_exposure: true, ae_percentile: 99.5, ae_target_fraction: 0.8, bits: 12}
    mount: {x_m: -0.55, y_m: 0.0, z_m: 1.0, pitch_deg: 15.0, yaw_deg: 180.0}
lights:                      # two headlights (sample values, see SpotlightConfig)
  - name: headlight_left
    mount: {x_m: 0.6, y_m: 0.3, z_m: 0.4, pitch_deg: 15.0}
    flux_lm: 3000.0
  - name: headlight_right
    mount: {x_m: 0.6, y_m: -0.3, z_m: 0.4, pitch_deg: 15.0}
    flux_lm: 3000.0
rover:
  kinematics: skid_steer
  wheels: 4
  wheelbase_m: 1.0
  track_m: 0.8
  origin_height_m: 0.5
  cg_height_m: 0.45
  max_speed_m_s: 0.2
lidars:
  # SPAD flash LiDAR (primary). Generic sample parameters, see LidarSpadConfig.
  - name: spad_flash
    pattern: {kind: flash, flash_width: 160, flash_height: 120, flash_hfov_deg: 60.0, flash_vfov_deg: 45.0,
              flash_projection: azel}   # rows = arcs around the sensor (see LidarPatternConfig)
    # mast: 3.7 m above flat ground (body origin = origin_height_m 0.5 m), 22 deg down (pitch > 0)
    mount: {x_m: 0.55, z_m: 3.2, pitch_deg: 22.0}
    noise:
      model: spad
      range_max_m: 100.0
      # pulse energy: sample value giving a complete range image to range_max_m also on sunlit ground
      # (1e-6 J loses returns beyond ~20 m in sunlight); range walk corrected by the sensor.
      spad: {pulse_energy_j: 5.0e-4, filter_bandwidth_nm: 1.0, pulses_per_frame: 1000, range_walk_correction: true}
  # Rotating 32-beam LiDAR with the simple Gaussian model (for comparison).
  - name: spin32
    pattern: {kind: spinning, channels: 32, vertical_min_deg: -25.0, vertical_max_deg: 15.0, horizontal_resolution_deg: 0.2}
    noise: {model: gaussian, range_max_m: 100.0}
