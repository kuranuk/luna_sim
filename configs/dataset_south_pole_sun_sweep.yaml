# Same rover path in the south-polar scene under three sun elevations (SPEC 9).
# Generate with:  lunarsim dataset configs/dataset_south_pole_sun_sweep.yaml
scenario: south_pole_lowsun_stereo.yaml
output_dir: out/datasets/south_pole_sun_sweep
duration_s: 60.0
frame_rate_hz: 2.0
trajectory:
  waypoints: [[6.0, 0.0], [6.0, 5.0], [0.0, 5.0]]
  speed_m_s: 0.2
cameras: [navcam]
stereo: true
camera_buffers: [depth, labels, shadow]
lidars: [spad_flash]
lidar_formats: [bin, ply]
variations:
  - {name: sun_el01, azimuth_deg: 48.9, elevation_deg: 1.0, lights_on: false}
  - {name: sun_el05, azimuth_deg: 48.9, elevation_deg: 5.0, lights_on: false}
  - {name: sun_el20, azimuth_deg: 48.9, elevation_deg: 20.0, lights_on: false}
